name: Sync FBref stats to Supabase

on:
  schedule:
    # Todos los lunes 08:00 UTC (05:00 Argentina)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Temporada a actualizar (ej. 2026)"
        required: false
        default: "2026"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Instalar navegador Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Correr sincronizacion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
          SEASON: ${{ inputs.season || '2026' }}
        run: python scripts/sync_fbref.py
