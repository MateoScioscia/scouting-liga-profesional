name: Fetch match-by-match stats from FBref

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Temporada (ej. 2025). Prueba tambien el rango partido (2024-2025) si el año simple no responde."
        required: false
        default: "2025"
      player_name:
        description: "Opcional: nombre (o parte) de un jugador puntual, para probar sin correr el plantel completo"
        required: false
        default: ""
      max_players:
        description: "Opcional: tope de jugadores a procesar en esta corrida (FBref rate-limita agresivo)"
        required: false
        default: ""

jobs:
  fetch-fbref-matchlogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml playwright

      - name: Instalar navegador Chromium (Playwright)
        run: playwright install --with-deps chromium

      - name: Scrapear match logs de FBref
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
          SEASON: ${{ inputs.season || '2025' }}
          PLAYER_FILTER: ${{ inputs.player_name }}
          MAX_PLAYERS: ${{ inputs.max_players }}
        run: python scripts/fetch_fbref_matchlogs.py
